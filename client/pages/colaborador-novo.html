<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Colaborador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/colaborador-novo.css" />

    <style>
      body {
        padding-bottom: 100px; /* evita conteúdo ficar atrás dos botões */
      }
    </style>
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <a class="navbar-brand ms-3" href="../pages/home.html">TALENTUM RH</a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="../pages/colaborador-novo.html"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a
                    class="dropdown-item"
                    href="../pages/colaborador-lista.html"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="../pages/escala-novo.html"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="../pages/escala-lista.html"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Novo Cadastro</a></li>
                <li><a class="dropdown-item" href="#">Lista</a></li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#">Indicadores</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge">Colaborador > Novo cadastro</span>
      </h4>
    </div>

    <!-- FORMULÁRIO -->
    <div
      class="container d-flex justify-content-center align-items-center mt-4"
      style="min-height: 70vh"
    >
      <form id="formColaborador" class="row g-3 w-75">
        <div class="col-md-6">
          <label class="form-label">Nome completo</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Data de nascimento</label>
          <input type="date" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Sexo</label>
          <select class="form-select">
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Filial</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Função</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Salário mensal</label>
          <input type="number" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Salário hora</label>
          <input type="number" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Data de admissão</label>
          <input type="date" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Data de demissão</label>
          <input type="date" class="form-control" />
        </div>
      </form>
    </div>

    <!-- BOTÕES FIXOS -->
    <div class="fixed-bottom bg-white border-top p-3">
      <div class="container d-flex justify-content-center gap-3">
        <button type="reset" form="formColaborador" class="btn btn-cancel">
          Cancelar
        </button>
        <button type="submit" form="formColaborador" class="btn btn-save">
          Salvar
        </button>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

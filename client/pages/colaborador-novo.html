<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Colaborador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/colaborador-novo.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <a class="navbar-brand ms-3" href="{{ url_for('home') }}">
        TALENTUM RH
      </a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <!-- Colaborador -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_novo') }}"
                  >
                    Novo cadastro
                  </a>
                </li>

                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_lista') }}"
                  >
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Escala -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_novo') }}">
                    Novo cadastro
                  </a>
                </li>

                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_lista') }}">
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Férias -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_novo') }}">
                    Novo Cadastro
                  </a>
                </li>

                <li>
                  <a class="dropdown-item" href="#"> Lista </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Indicadores -->
          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#"> Indicadores </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge"> Colaborador > Novo cadastro </span>
      </h4>
    </div>

    <!-- FORMULÁRIO -->
    <div
      class="container d-flex justify-content-center align-items-center mt-4"
      style="min-height: 70vh"
    >
      <form id="formColaborador" class="row g-4 w-75">
        <!-- Nome -->
        <div class="col-md-6">
          <label class="form-label"> Nome completo </label>

          <input type="text" class="form-control" />
        </div>

        <!-- CPF -->
        <div class="col-md-3">
          <label class="form-label"> CPF </label>

          <input type="text" class="form-control" />
        </div>

        <!-- Nascimento -->
        <div class="col-md-3">
          <label class="form-label"> Data de nascimento </label>

          <input type="date" class="form-control" />
        </div>

        <!-- Sexo -->
        <div class="col-md-3">
          <label class="form-label"> Sexo </label>

          <select class="form-select">
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </div>

        <!-- Filial -->
        <div class="col-md-3">
          <label class="form-label"> Filial </label>

          <input type="text" class="form-control" />
        </div>

        <!-- Função -->
        <div class="col-md-3">
          <label class="form-label"> Função </label>

          <input type="text" class="form-control" />
        </div>

        <!-- Salário Mensal -->
        <div class="col-md-3">
          <label class="form-label"> Salário mensal </label>

          <input type="number" class="form-control" />
        </div>

        <!-- Salário Hora -->
        <div class="col-md-3">
          <label class="form-label"> Salário hora </label>

          <input type="number" class="form-control" />
        </div>

        <!-- Admissão -->
        <div class="col-md-3">
          <label class="form-label"> Data de admissão </label>

          <input type="date" class="form-control" />
        </div>

        <!-- Demissão -->
        <div class="col-md-3">
          <label class="form-label"> Data de demissão </label>

          <input type="date" class="form-control" />
        </div>
      </form>
    </div>

    <!-- BOTÕES FIXOS -->
    <div class="fixed-bottom bg-white border-top p-3">
      <div class="container d-flex justify-content-center gap-3">
        <button type="reset" form="formColaborador" class="btn btn-cancel">
          Cancelar
        </button>

        <button type="submit" form="formColaborador" class="btn btn-save">
          Salvar
        </button>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <div class="container-fluid login-container">
      <div class="row h-100">
        <!-- Lado esquerdo -->
        <div
          class="col-md-8 d-none d-md-flex align-items-center justify-content-center"
        >
          <div class="login-image"></div>
        </div>

        <!-- Lado direito (formulário) -->
        <div class="col-md-4 d-flex align-items-center justify-content-center">
          <div class="w-75 form-container">
            <h3 class="mb-4 text-center">Login</h3>

            <form action="/login" method="post">
              <div class="mb-3">
                <label class="form-label">Usuário</label>
                <!-- inserido parâmetro name, com o atributo "user", para o Flask -->
                <input
                  type="text"
                  name = "user"
                  class="form-control"
                  placeholder="Digite seu usuário"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Senha</label>
                <! inserido parâmetro name, com o atributo "password", para o Flask -->
                <input
                  type="password"
                  name="password" 
                  class="form-control"
                  placeholder="Digite sua senha"
                />
              </div>

              <button type="submit" class="btn btn-custom w-100">
                Acessar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Rodapé -->
    <footer>
      <p>© 2026 - Todos os direitos reservados</p>
    </footer>
  </body>
</html>

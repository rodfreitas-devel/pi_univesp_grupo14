<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Colaboradores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/colaboradores.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <!-- LOGO -->
      <a class="navbar-brand ms-3" href="#">TALENTUM RH</a>

      <!-- TOGGLER -->
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
        aria-controls="menu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <!-- Dropdown Colaborador -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a
                    class="dropdown-item"
                    href="../pages/colaborador-cadastro.html"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="../pages/colaboradores.html"
                    >Colaboradores</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <!-- Dropdown Escala -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Novo cadastro</a></li>
                <li><a class="dropdown-item" href="#">Escalas</a></li>
              </ul>
            </div>
          </li>

          <!-- Dropdown Férias -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Novo Cadastro</a></li>
                <li><a class="dropdown-item" href="#">Férias</a></li>
              </ul>
            </div>
          </li>

          <!-- Botão Indicadores -->
          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#">Indicadores</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->

    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge">Colaborador > Colaboradores</span>
      </h4>
    </div>

    <!-- Barra de Pesquisa -->
    <div class="container mt-4">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Pesquisar colaborador por nome..."
        onkeyup="filterCollaborators()"
      />
    </div>

    <div class="container mt-4">
      <table class="table table-striped align-middle">
        <tbody id="collaborators-list">
          <!-- Lista será carregada aqui -->
        </tbody>
      </table>
    </div>

    <!-- Modal de Edição -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Editar Colaborador</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <!-- Formulário -->
            <form id="editForm">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome completo</label>
                <input type="text" class="form-control" id="nome" required />
              </div>
              <div class="mb-3">
                <label for="cpf" class="form-label">CPF</label>
                <input type="text" class="form-control" id="cpf" required />
              </div>
              <div class="mb-3">
                <label for="nascimento" class="form-label"
                  >Data de nascimento</label
                >
                <input
                  type="date"
                  class="form-control"
                  id="nascimento"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="sexo" class="form-label">Sexo</label>
                <select class="form-select" id="sexo" required>
                  <option>Masculino</option>
                  <option>Feminino</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="filial" class="form-label">Filial</label>
                <input type="text" class="form-control" id="filial" required />
              </div>
              <div class="mb-3">
                <label for="funcao" class="form-label">Função</label>
                <input type="text" class="form-control" id="funcao" required />
              </div>
              <div class="mb-3">
                <label for="salarioMensal" class="form-label"
                  >Salário mensal</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="salarioMensal"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="salarioHora" class="form-label">Salário hora</label>
                <input
                  type="number"
                  class="form-control"
                  id="salarioHora"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="admissao" class="form-label"
                  >Data de admissão</label
                >
                <input
                  type="date"
                  class="form-control"
                  id="admissao"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="demissao" class="form-label"
                  >Data de demissão</label
                >
                <input type="date" class="form-control" id="demissao" />
              </div>
              <div class="d-flex justify-content-center gap-3">
                <button
                  type="button"
                  class="btn btn-secondary"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>
                <button type="submit" class="btn btn-primary">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/colaboradores.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Escalas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/escala-lista.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <a class="navbar-brand ms-3" href="{{ url_for('home') }}">
        TALENTUM RH
      </a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
        aria-controls="menu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <!-- Colaborador -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_novo') }}"
                  >
                    Novo cadastro
                  </a>
                </li>

                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_lista') }}"
                  >
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Escala -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_novo') }}">
                    Novo cadastro
                  </a>
                </li>

                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_lista') }}">
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Férias -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_novo') }}">
                    Novo Cadastro
                  </a>
                </li>

                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_lista') }}">
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- FALTAS (NOVO DROPDOWN) -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Faltas
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('faltas_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('faltas_lista') }}"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <!-- Indicadores -->
          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#"> Indicadores </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge"> Escala > Lista </span>
      </h4>
    </div>

    <!-- BUSCA -->
    <div class="container mt-4 d-flex justify-content-center">
      <div class="w-75">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Pesquisar escala por colaborador..."
          onkeyup="filterEscalas()"
        />
      </div>
    </div>

    <!-- TABELA -->
    <div class="container mt-4">
      <div class="table-responsive">
        <table class="table table-striped align-middle shadow-sm">
          <tbody id="escalas-list"></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="editEscalaModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- HEADER -->
          <div class="modal-header">
            <h5 class="modal-title">Editar Escala</h5>

            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- BODY -->
          <div class="modal-body">
            <form id="editEscalaForm">
              <!-- Colaborador -->
              <div class="mb-3">
                <label class="form-label"> Colaborador </label>

                <input
                  type="text"
                  id="editColaborador"
                  class="form-control"
                  disabled
                />
              </div>

              <!-- Jornada -->
              <div class="mb-3">
                <label class="form-label"> Jornada </label>

                <select id="editJornada" class="form-select">
                  <option>4h</option>
                  <option>6h</option>
                  <option>8h</option>
                  <option>12h</option>
                </select>
              </div>

              <!-- Turnos -->
              <div class="mb-4">
                <label class="form-label"> Turnos </label>

                <select id="editTurno" class="form-select">
                  <option>Manhã</option>
                  <option>Tarde</option>
                  <option>Noite</option>
                </select>

                <button
                  type="button"
                  class="btn btn-outline-success mt-3"
                  onclick="addTurnoEdit()"
                >
                  Adicionar Turno
                </button>

                <ul id="editListaTurnos" class="list-group mt-3"></ul>
              </div>

              <!-- BOTÕES -->
              <div class="d-flex justify-content-center gap-3">
                <button
                  type="button"
                  class="btn btn-cancel"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>

                <button type="submit" class="btn btn-save">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="../static/js/escala-lista.js"></script>
  </body>
</html>

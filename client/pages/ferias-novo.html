<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Férias</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/ferias-novo.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <a class="navbar-brand ms-3" href="{{ url_for('home') }}">TALENTUM RH</a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_lista') }}"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_lista') }}"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li><a class="dropdown-item" href="#">Lista</a></li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#">Indicadores</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge">Férias > Novo cadastro</span>
      </h4>
    </div>

    <!-- FORMULÁRIO -->
    <div class="container d-flex justify-content-center mt-4">
      <form id="formFerias" class="row g-4 w-75">
        <!-- Colaborador -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label"> Selecionar pessoa colaboradora </label>

            <select class="form-select">
              <option value="">Selecione</option>
              <option>João Silva</option>
              <option>Maria Souza</option>
              <option>Carlos Oliveira</option>
            </select>
          </div>
        </div>

        <!-- Data de início -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Data de início</label>

            <input type="date" class="form-control" />
          </div>
        </div>

        <!-- Quantidade de dias -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Quantidade de dias</label>

            <select class="form-select">
              <option value="">Selecione</option>
              <option>5 dias</option>
              <option>10 dias</option>
              <option>15 dias</option>
              <option>20 dias</option>
              <option>30 dias</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <!-- BOTÕES FIXOS -->
    <div class="fixed-bottom bg-white border-top p-3">
      <div class="container d-flex justify-content-center gap-3">
        <button type="reset" form="formFerias" class="btn btn-cancel">
          Cancelar
        </button>

        <button type="submit" form="formFerias" class="btn btn-save">
          Salvar
        </button>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

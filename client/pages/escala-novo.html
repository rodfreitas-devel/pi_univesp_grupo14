<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Escala</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="../static/css/escala-novo.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <a class="navbar-brand ms-3" href="../pages/home.html">TALENTUM RH</a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="../pages/colaborador-novo.html"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a
                    class="dropdown-item"
                    href="../pages/colaborador-lista.html"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="../pages/escala-novo.html"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="../pages/escala-lista.html"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Novo Cadastro</a></li>
                <li><a class="dropdown-item" href="#">Lista</a></li>
              </ul>
            </div>
          </li>

          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#">Indicadores</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge">Escala > Novo cadastro</span>
      </h4>
    </div>

    <!-- FORMULÁRIO -->
    <div class="container d-flex justify-content-center mt-4">
      <form id="formEscala" class="row g-3 w-75">
        <!-- Colaborador -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Colaborador</label>
            <select class="form-select" id="colaborador">
              <option value="">Selecione</option>
              <option>João</option>
              <option>Maria</option>
              <option>Carlos</option>
            </select>
          </div>
        </div>

        <!-- Jornada -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Quantidade de horas</label>
            <select class="form-select" id="jornada">
              <option value="">Selecione</option>
              <option>4h</option>
              <option>6h</option>
              <option>8h</option>
              <option>12h</option>
            </select>

            <button
              type="button"
              class="btn btn-outline-primary mt-2"
              onclick="adicionarJornada()"
            >
              Adicionar Jornada
            </button>

            <div id="jornadaSelecionada" class="mt-2"></div>
          </div>
        </div>

        <!-- Turno -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Turno</label>
            <select class="form-select" id="turno">
              <option value="">Selecione</option>
              <option>Manhã</option>
              <option>Tarde</option>
              <option>Noite</option>
            </select>

            <button
              type="button"
              class="btn btn-outline-success mt-2"
              onclick="adicionarTurno()"
            >
              Adicionar Turno
            </button>

            <ul id="listaTurnos" class="list-group mt-2"></ul>
          </div>
        </div>
      </form>
    </div>

    <!-- BOTÕES FIXOS -->
    <div class="fixed-bottom bg-white border-top p-3">
      <div class="container d-flex justify-content-center gap-3">
        <button type="reset" form="formEscala" class="btn btn-cancel">
          Cancelar
        </button>
        <button type="submit" form="formEscala" class="btn btn-save">
          Salvar
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/escala-novo.js"></script>
  </body>
</html>

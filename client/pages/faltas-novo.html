<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Faltas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/faltas-novo.css" />
  </head>

  <body>
    <!-- NAVBAR (MESMO PADRÃO DO COLABORADOR) -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <a class="navbar-brand ms-3" href="{{ url_for('home') }}">
        TALENTUM RH
      </a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <!-- COLABORADOR -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_lista') }}"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <!-- ESCALA -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_lista') }}"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <!-- FÉRIAS -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_lista') }}"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <!-- FALTAS (NOVO DROPDOWN) -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Faltas
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('faltas_novo') }}"
                    >Novo cadastro</a
                  >
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('faltas_lista') }}"
                    >Lista</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <!-- INDICADORES -->
          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#"> Indicadores </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge"> Faltas > Novo cadastro </span>
      </h4>
    </div>

    <!-- FORMULÁRIO -->
    <div
      class="container d-flex justify-content-center align-items-center mt-4"
      style="min-height: 70vh"
    >
      <form id="formFaltas" class="row g-4 w-75">
        <!-- Colaborador -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Colaborador</label>

            <select class="form-select" id="colaborador" required>
              <option value="">Selecione</option>
              <option>João Silva</option>
              <option>Maria Souza</option>
              <option>Carlos Oliveira</option>
            </select>
          </div>
        </div>

        <!-- Data da falta -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Data da falta</label>

            <input type="date" class="form-control" id="dataFalta" required />
          </div>
        </div>

        <!-- Motivo -->
        <div class="col-12 d-flex justify-content-center">
          <div class="w-100 w-md-50">
            <label class="form-label">Motivo</label>

            <select class="form-select" id="motivo" required>
              <option value="">Selecione</option>
              <option>Atestado médico</option>
              <option>Falta injustificada</option>
              <option>Problema pessoal</option>
              <option>Outros</option>
            </select>
          </div>
        </div>
      </form>
    </div>

    <!-- BOTÕES FIXOS -->
    <div class="fixed-bottom bg-white border-top p-3">
      <div class="container d-flex justify-content-center gap-3">
        <button type="reset" form="formFaltas" class="btn btn-cancel">
          Cancelar
        </button>

        <button type="submit" form="formFaltas" class="btn btn-save">
          Salvar
        </button>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="../static/js/faltas-novo.js"></script>
  </body>
</html>

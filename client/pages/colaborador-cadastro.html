<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Colaborador</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../css/colaborador-cadastro.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <!-- LOGO -->
      <a class="navbar-brand ms-3" href="#">TALENTUM RH</a>

      <!-- TOGGLER -->
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
        aria-controls="menu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <!-- Dropdown Colaborador -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Novo cadastro</a></li>
                <li><a class="dropdown-item" href="#">Colaboradores</a></li>
              </ul>
            </div>
          </li>

          <!-- Dropdown Escala -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Novo cadastro</a></li>
                <li><a class="dropdown-item" href="#">Escalas</a></li>
              </ul>
            </div>
          </li>

          <!-- Dropdown Férias -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Novo Cadastro</a></li>
                <li><a class="dropdown-item" href="#">Férias</a></li>
              </ul>
            </div>
          </li>

          <!-- Botão Indicadores -->
          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#">Indicadores</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->

    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge">Colaborador > Novo cadastro</span>
      </h4>
    </div>

    <!-- FORMULÁRIO -->
    <div
      class="container d-flex justify-content-center align-items-center mt-4"
      style="min-height: 70vh"
    >
      <form class="row g-3 w-75">
        <div class="col-md-6">
          <label class="form-label">Nome completo</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Data de nascimento</label>
          <input type="date" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Sexo</label>
          <select class="form-select">
            <option>Masculino</option>
            <option>Feminino</option>
          </select>
        </div>

        <div class="col-md-3">
          <label class="form-label">Filial</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Função</label>
          <input type="text" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Salário mensal</label>
          <input type="number" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Salário hora</label>
          <input type="number" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Data de admissão</label>
          <input type="date" class="form-control" />
        </div>

        <div class="col-md-3">
          <label class="form-label">Data de demissão</label>
          <input type="date" class="form-control" />
        </div>

        <!-- BOTÕES -->
        <div class="col-12 mt-5 mb-5 d-flex justify-content-center gap-3">
          <button type="button" class="btn btn-cancel me-2">Cancelar</button>
          <button type="submit" class="btn btn-save">Salvar</button>
        </div>
      </form>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>

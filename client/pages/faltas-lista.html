<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Lista de Faltas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/faltas-lista.css" />
  </head>

  <body>
    <!-- NAVBAR (IGUAL FÉRIAS LISTA) -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <a class="navbar-brand ms-3" href="{{ url_for('home') }}">
        TALENTUM RH
      </a>

      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <!-- Colaborador -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_novo') }}"
                  >
                    Novo cadastro
                  </a>
                </li>
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_lista') }}"
                  >
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Escala -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_novo') }}">
                    Novo cadastro
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_lista') }}">
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Férias -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_novo') }}">
                    Novo cadastro
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_lista') }}">
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- FALTAS (MESMO PADRÃO) -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                data-bs-toggle="dropdown"
              >
                Faltas
              </a>
              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('faltas_novo') }}">
                    Novo cadastro
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" href="{{ url_for('faltas_lista') }}">
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Indicadores -->
          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#"> Indicadores </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge"> Faltas > Lista </span>
      </h4>
    </div>

    <!-- BUSCA -->
    <div class="container mt-4 d-flex justify-content-center">
      <div class="w-75">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Pesquisar falta por colaborador..."
          onkeyup="filtrarFaltas()"
        />
      </div>
    </div>

    <!-- TABELA -->
    <div class="container mt-4">
      <div class="table-responsive">
        <table class="table table-striped align-middle shadow-sm">
          <tbody id="listaFaltas"></tbody>
        </table>
      </div>
    </div>

    <!-- MODAL EDITAR -->
    <div class="modal fade" id="modalEditar" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar Falta</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form id="formEditarFalta">
              <div class="mb-3">
                <label class="form-label">Colaborador</label>
                <input
                  type="text"
                  id="editColaborador"
                  class="form-control"
                  disabled
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Data da falta</label>
                <input type="date" id="editDataFalta" class="form-control" />
              </div>

              <div class="mb-3">
                <label class="form-label">Motivo</label>
                <select id="editMotivo" class="form-select">
                  <option>Atestado médico</option>
                  <option>Falta injustificada</option>
                  <option>Problema pessoal</option>
                  <option>Outros</option>
                </select>
              </div>

              <div class="d-flex justify-content-center gap-3">
                <button
                  type="button"
                  class="btn btn-cancel"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>

                <button type="submit" class="btn btn-save">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="../static/js/faltas-lista.js"></script>
  </body>
</html>

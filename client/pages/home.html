<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Inicial</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonte -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Ícones -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/home.css" />
  </head>

  <body>
    <div class="container-fluid min-vh-100 d-flex align-items-center">
      <div class="row w-100">
        <!-- Imagem -->
        <div
          class="col-md-6 d-none d-md-flex justify-content-center align-items-center mb-4 mb-md-0"
        >
          <div class="home-image"></div>
        </div>

        <!-- Conteúdo -->
        <div class="col-md-6">
          <div class="mx-auto" style="max-width: 500px">
            <div class="card mb-3 text-center">
              <div class="card-body">
                <h5 class="card-title">Colaboradores</h5>
                <a
                  href="{{ url_for('colaborador_novo') }}"
                  class="btn btn-custom"
                >
                  <i class="fas fa-user-plus"></i> Novo
                </a>
                <a
                  href="{{ url_for('colaborador_lista') }}"
                  class="btn btn-custom"
                >
                  <i class="fas fa-users"></i> Lista
                </a>
              </div>
            </div>

            <div class="card mb-3 text-center">
              <div class="card-body">
                <h5 class="card-title">Escalas</h5>
                <a href="{{ url_for('escala_novo') }}" class="btn btn-custom">
                  <i class="fas fa-calendar-plus"></i> Novo
                </a>
                <a href="{{ url_for('escala_lista') }}" class="btn btn-custom">
                  <i class="fas fa-calendar-alt"></i> Lista
                </a>
              </div>
            </div>

            <div class="card mb-3 text-center">
              <div class="card-body">
                <h5 class="card-title">Férias</h5>
                <a href="{{ url_for('ferias_novo') }}" class="btn btn-custom">
                  <i class="fas fa-umbrella-beach"></i> Novo
                </a>
                <a href="{{ url_for('ferias_lista') }}" class="btn btn-custom">
                  <i class="fas fa-list"></i> Lista
                </a>
              </div>
            </div>

            <div class="card text-center">
              <div class="card-body">
                <h5 class="card-title">Indicadores</h5>
                <a href="{{ url_for('indicadores') }}" class="btn btn-custom">
                  <i class="fas fa-chart-line"></i> Ver
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Colaboradores</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="../static/css/colaborador-lista.css" />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom px-3">
      <!-- LOGO -->
      <a class="navbar-brand ms-3" href="{{ url_for('home') }}">
        TALENTUM RH
      </a>

      <!-- TOGGLER -->
      <button
        class="navbar-toggler ms-auto"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menu"
        aria-controls="menu"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- MENU -->
      <div class="collapse navbar-collapse ms-3" id="menu">
        <ul class="navbar-nav me-auto gap-2">
          <!-- Colaborador -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Colaborador
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_novo') }}"
                  >
                    Novo cadastro
                  </a>
                </li>

                <li>
                  <a
                    class="dropdown-item"
                    href="{{ url_for('colaborador_lista') }}"
                  >
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Escala -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Escala
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_novo') }}">
                    Novo cadastro
                  </a>
                </li>

                <li>
                  <a class="dropdown-item" href="{{ url_for('escala_lista') }}">
                    Lista
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Férias -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="btn btn-dropdown-green dropdown-toggle"
                href="#"
                data-bs-toggle="dropdown"
              >
                Férias
              </a>

              <ul class="dropdown-menu">
                <li>
                  <a class="dropdown-item" href="{{ url_for('ferias_novo') }}">
                    Novo Cadastro
                  </a>
                </li>

                <li>
                  <a class="dropdown-item" href="#"> Lista </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Indicadores -->
          <li class="nav-item">
            <a class="btn btn-dropdown-green" href="#"> Indicadores </a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- FAIXA ROXA -->
    <div class="purple-bar"></div>

    <!-- TÍTULO -->
    <div class="container d-flex justify-content-center mt-5">
      <h4>
        <span class="badge"> Colaborador > Lista </span>
      </h4>
    </div>

    <!-- PESQUISA -->
    <div class="container mt-4 d-flex justify-content-center">
      <div class="w-75">
        <input
          type="text"
          id="searchInput"
          class="form-control"
          placeholder="Pesquisar colaborador por nome..."
          onkeyup="filterCollaborators()"
        />
      </div>
    </div>

    <!-- TABELA -->
    <div class="container mt-4">
      <div class="table-responsive">
        <table class="table table-striped align-middle shadow-sm">
          <tbody id="collaborators-list">
            <!-- Lista será carregada aqui -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- MODAL -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <!-- HEADER -->
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Editar Colaborador</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <!-- BODY -->
          <div class="modal-body">
            <form id="editForm">
              <!-- Nome -->
              <div class="mb-3">
                <label for="nome" class="form-label"> Nome completo </label>

                <input type="text" class="form-control" id="nome" required />
              </div>

              <!-- CPF -->
              <div class="mb-3">
                <label for="cpf" class="form-label"> CPF </label>

                <input type="text" class="form-control" id="cpf" required />
              </div>

              <!-- Nascimento -->
              <div class="mb-3">
                <label for="nascimento" class="form-label">
                  Data de nascimento
                </label>

                <input
                  type="date"
                  class="form-control"
                  id="nascimento"
                  required
                />
              </div>

              <!-- Sexo -->
              <div class="mb-3">
                <label for="sexo" class="form-label"> Sexo </label>

                <select class="form-select" id="sexo" required>
                  <option>Masculino</option>
                  <option>Feminino</option>
                </select>
              </div>

              <!-- Filial -->
              <div class="mb-3">
                <label for="filial" class="form-label"> Filial </label>

                <input type="text" class="form-control" id="filial" required />
              </div>

              <!-- Função -->
              <div class="mb-3">
                <label for="funcao" class="form-label"> Função </label>

                <input type="text" class="form-control" id="funcao" required />
              </div>

              <!-- Salário mensal -->
              <div class="mb-3">
                <label for="salarioMensal" class="form-label">
                  Salário mensal
                </label>

                <input
                  type="number"
                  class="form-control"
                  id="salarioMensal"
                  required
                />
              </div>

              <!-- Salário hora -->
              <div class="mb-3">
                <label for="salarioHora" class="form-label">
                  Salário hora
                </label>

                <input
                  type="number"
                  class="form-control"
                  id="salarioHora"
                  required
                />
              </div>

              <!-- Admissão -->
              <div class="mb-3">
                <label for="admissao" class="form-label">
                  Data de admissão
                </label>

                <input
                  type="date"
                  class="form-control"
                  id="admissao"
                  required
                />
              </div>

              <!-- Demissão -->
              <div class="mb-4">
                <label for="demissao" class="form-label">
                  Data de demissão
                </label>

                <input type="date" class="form-control" id="demissao" />
              </div>

              <!-- BOTÕES -->
              <div class="d-flex justify-content-center gap-3">
                <button
                  type="button"
                  class="btn btn-cancel"
                  data-bs-dismiss="modal"
                >
                  Cancelar
                </button>

                <button type="submit" class="btn btn-save">Salvar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS -->
    <script src="../static/js/colaborador-lista.js"></script>
  </body>
</html>

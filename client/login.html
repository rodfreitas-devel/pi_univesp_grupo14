<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #ffffff;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .login-container {
        padding: 100px;
        flex: 1;
      }

      .login-image {
        background: url("https://alunounivespbr-my.sharepoint.com/:i:/r/personal/24225635_aluno_univesp_br/Documents/PI/JI110%20-%20A2026S1N3%20-%20Grupo%2014/Logo/talentum-rh.jpeg?csf=1&web=1&e=Bmsog8")
          no-repeat center center;
        background-size: cover;
        height: 400px;
        width: 600px;
        border-radius: 20px;
      }

      .btn-custom {
        background-color: #90ee90;
        border: none;
      }

      .btn-custom:hover {
        background-color: #7edc7e;
      }

      footer {
        background-color: purple;
        color: white;
        text-align: center;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      footer p {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid login-container">
      <div class="row h-100">
        <!-- Lado esquerdo -->
        <div
          class="col-md-8 d-none d-md-flex align-items-center justify-content-center"
        >
          <div class="login-image"></div>
        </div>

        <!-- Lado direito (formulário) -->
        <div class="col-md-4 d-flex align-items-center justify-content-center">
          <div class="w-75 form-container">
            <h3 class="mb-4 text-center">Login</h3>

            <form>
              <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Digite seu usuário"
                />
              </div>

              <div class="mb-3">
                <label class="form-label">Senha</label>
                <input
                  type="password"
                  class="form-control"
                  placeholder="Digite sua senha"
                />
              </div>

              <button type="submit" class="btn btn-custom w-100">
                Acessar
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Rodapé -->
    <footer>
      <p>© 2026 - Todos os direitos reservados</p>
    </footer>
  </body>
</html>
